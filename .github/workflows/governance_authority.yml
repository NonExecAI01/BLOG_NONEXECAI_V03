# DISABLED — governance runs on Cursor Cloud Automations only (et@edgephone.ai).
# Manual emergency run: Actions -> Governance Authority Agent -> Run workflow

name: Governance Authority Agent

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Force phase (DAWN, AFTERNOON) or auto from UTC hour'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - DAWN
          - AFTERNOON

concurrency:
  group: governance-authority
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  governance-run:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disabled — use Cursor Cloud Automations on et@edgephone.ai"
