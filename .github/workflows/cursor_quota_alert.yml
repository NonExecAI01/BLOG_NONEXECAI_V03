# Cursor-only alert when API tokens or on-demand spend limit is exhausted.
# Writes .cursor/rules/spend-limit-alert.mdc — no email.

name: Cursor Quota Alert

on:
  schedule:
    - cron: '0 */4 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Rewrite alert even if already active this billing cycle'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  quota-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check quota and update Cursor alert
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python notify_spend_limit.py --check $FORCE

      - name: Commit alert state
        run: |
          git config --global user.name  "NonExecAI Governance Bot"
          git config --global user.email "bot@non-exec.ai"
          git add "NonExecAI Cost Cycling/.spend-limit-alert-state.json" automation/cursor-account.json automation/CURSOR-SPEND-LIMIT-NOTE.md automation/CURSOR-SPEND-LIMIT-RESOLVED.md .cursor/rules/spend-limit-alert.mdc .cursor/rules/spend-limit-resolved.mdc 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No alert state changes."
          else
            git commit -m "Cursor quota alert state update [skip ci]"
            git push origin main
          fi
