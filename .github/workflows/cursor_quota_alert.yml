# Alert when Cursor API tokens or on-demand spend limit is exhausted.
# Emails et@edgephone.ai and et@non-exec.ai with: INCREASE SPEND LIMIT ON CURSOR

name: Cursor Quota Alert

on:
  schedule:
    - cron: '0 */4 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Send alert even if already sent this billing cycle'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  quota-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Check quota and send alert if needed
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python notify_spend_limit.py --check $FORCE

      - name: Commit alert state
        run: |
          git config --global user.name  "NonExecAI Governance Bot"
          git config --global user.email "bot@non-exec.ai"
          git add "NonExecAI Cost Cycling/.spend-limit-alert-state.json" automation/cursor-account.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No alert state changes."
          else
            git commit -m "Cursor quota alert state update [skip ci]"
            git push origin main
          fi
